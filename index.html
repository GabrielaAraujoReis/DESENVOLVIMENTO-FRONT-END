<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Quadro de Tarefas Acadêmicas</h1>
    </header>

    <main>
        <section class="filters-panel" aria-labelledby="titulo-busca-filtros">
            <h2 id="titulo-busca-filtros">Busca e filtros</h2>

            <form>
                <fieldset class="filters-grid">
                    <legend>Encontre tarefas no quadro</legend>

                    <p class="form-field search-field">
                        <label for="busca-titulo">Buscar pelo título da tarefa:</label>
                        <input type="search" id="busca-titulo" name="busca-titulo">
                    </p>

                    <p class="form-field">
                        <label for="filtro-status">Filtrar por status:</label>

                        <select id="filtro-status" name="filtro-status">
                            <option value="todos">Todos os status</option>
                            <option value="a-fazer">A fazer</option>
                            <option value="em-andamento">Em andamento</option>
                            <option value="em-revisao">Em revisão</option>
                            <option value="concluida">Concluída</option>
                        </select>
                    </p>

                    <p class="form-field">
                        <label for="filtro-prioridade">Filtrar por prioridade:</label>

                        <select id="filtro-prioridade" name="filtro-prioridade">
                            <option value="todas">Todas as prioridades</option>
                            <option value="baixa">Baixa</option>
                            <option value="media">Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </p>

                    <div class="form-actions">
                        <button type="submit">Aplicar filtros</button>
                        <button type="reset">Limpar filtros</button>
                    </div>
                </fieldset>
            </form>
        </section>

        <section class="board-section" aria-labelledby="titulo-quadro">
            <h2 id="titulo-quadro">Quadro de tarefas</h2>

            <p
                class="screen-state"
                data-estado
                role="status"
                aria-live="polite">
            </p>

            <div class="task-board" data-quadro>

                <section
                    class="status-column status-todo"
                    aria-labelledby="titulo-a-fazer">

                    <div class="status-title-row">
                        <h3 id="titulo-a-fazer">A fazer</h3>
                        <span class="status-percent">0%</span>
                    </div>

                    <div class="status-progressbar" aria-hidden="true">
                        <div class="status-progressbar-fill"></div>
                    </div>

                    <ul
                        class="task-list"
                        data-lista-status="a-fazer">
                    </ul>
                </section>

                <section
                    class="status-column status-progress"
                    aria-labelledby="titulo-em-andamento">

                    <div class="status-title-row">
                        <h3 id="titulo-em-andamento">Em andamento</h3>
                        <span class="status-percent">40%</span>
                    </div>

                    <div class="status-progressbar" aria-hidden="true">
                        <div class="status-progressbar-fill"></div>
                    </div>

                    <ul
                        class="task-list"
                        data-lista-status="em-andamento">
                    </ul>
                </section>

                <section
                    class="status-column status-review"
                    aria-labelledby="titulo-em-revisao">

                    <div class="status-title-row">
                        <h3 id="titulo-em-revisao">Em revisão</h3>
                        <span class="status-percent">75%</span>
                    </div>

                    <div class="status-progressbar" aria-hidden="true">
                        <div class="status-progressbar-fill"></div>
                    </div>

                    <ul
                        class="task-list"
                        data-lista-status="em-revisao">
                    </ul>
                </section>

                <section
                    class="status-column status-done"
                    aria-labelledby="titulo-concluida">

                    <div class="status-title-row">
                        <h3 id="titulo-concluida">Concluída</h3>
                        <span class="status-percent">100%</span>
                    </div>

                    <div class="status-progressbar" aria-hidden="true">
                        <div class="status-progressbar-fill"></div>
                    </div>

                    <ul
                        class="task-list"
                        data-lista-status="concluida">
                    </ul>
                </section>

            </div>
        </section>
    </main>

    <footer>
        <p>Gabriela de Araújo Reis — Desenvolvimento Frontend — 2026.2</p>
    </footer>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
